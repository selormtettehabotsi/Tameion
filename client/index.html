<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tameion — KNUST Library</title>
    <meta name="description" content="Search the KNUST library catalogue, reserve titles and track your loans." />

    <!--
      Content Security Policy.

      'unsafe-inline' is required for style-src only: React sets inline style
      attributes for the progress bars, and Vite injects the stylesheet. There
      is no 'unsafe-inline' or 'unsafe-eval' for scripts.

      frame-ancestors is deliberately absent here — browsers ignore it in a
      meta tag. It is sent as a real header from nginx.conf instead.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: https://images.pexels.com;
        connect-src 'self';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
        upgrade-insecure-requests
      "
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-background text-on-surface font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
